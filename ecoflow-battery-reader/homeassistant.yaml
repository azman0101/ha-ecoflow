# À fusionner dans configuration.yaml du HA CIBLE. Fusionner les listes MQTT existantes.
mqtt:
  sensor:
  - name: EcoFlow batterie
    unique_id: ecoflow_classic_mqtt_soc_v1
    default_entity_id: sensor.ecoflow_batterie
    state_topic: ecoflow/delta3classic/soc
    value_template: '{{ value_json.value }}'
    json_attributes_topic: ecoflow/delta3classic/soc
    json_attributes_template: '{{ {''received_at'': value_json.received_at, ''source'':
      value_json.source} | tojson }}'
    availability_topic: ecoflow/delta3classic/availability
    payload_available: online
    payload_not_available: offline
    expire_after: 180
    qos: 1
    unit_of_measurement: '%'
    state_class: measurement
    device_class: battery
  - name: EcoFlow plafond charge
    unique_id: ecoflow_classic_mqtt_charge_limit_v1
