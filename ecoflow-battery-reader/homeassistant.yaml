    default_entity_id: binary_sensor.ecoflow_collecteur_connecte
    state_topic: ecoflow/delta3classic/availability
    payload_on: online
    payload_off: offline
    device_class: connectivity
    entity_category: diagnostic
    qos: 1

# Ces templates contrôlent aussi l'âge réel porté par chaque mesure.
template:
  - binary_sensor:
      - name: EcoFlow telemetrie recente
        unique_id: ecoflow_classic_telemetry_fresh_v1
        device_class: connectivity
        state: >-
          {% set soc = states('sensor.ecoflow_batterie') %}
          {% set age = as_timestamp(now()) - (state_attr('sensor.ecoflow_batterie', 'received_at') | float(0)) %}
          {{ is_state('binary_sensor.ecoflow_collecteur_connecte', 'on')
             and is_number(soc)
             and 0 <= (soc | float(-1)) <= 100
             and 0 <= age < 180 }}
      - name: EcoFlow charge cible atteinte
        unique_id: ecoflow_classic_charge_target_reached_v1
        availability: >-
          {% set soc = states('sensor.ecoflow_batterie') %}
          {% set limit = states('sensor.ecoflow_plafond_charge') %}
          {% set age_soc = as_timestamp(now()) - (state_attr('sensor.ecoflow_batterie', 'received_at') | float(0)) %}
          {% set age_limit = as_timestamp(now()) - (state_attr('sensor.ecoflow_plafond_charge', 'received_at') | float(0)) %}
          {{ is_state('binary_sensor.ecoflow_telemetrie_recente', 'on')
             and is_number(soc) and is_number(limit)
             and 0 <= (soc | float(-1)) <= 100
             and 1 <= (limit | float(-1)) <= 100
             and 0 <= age_soc < 180 and 0 <= age_limit < 180 }}
        state: >-
          {% set soc = states('sensor.ecoflow_batterie') | float(-1) %}
          {% set limit = states('sensor.ecoflow_plafond_charge') | float(101) %}
          {{ soc >= limit - 0.2 }}
        attributes:
          margin_percentage_points: 0.2
          target_soc: "{{ states('sensor.ecoflow_plafond_charge') }}"
