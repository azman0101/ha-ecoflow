name: "EcoFlow DELTA 3 Reader"
slug: "ecoflow_delta3_reader"
description: "Collecteur MQTT EcoFlow permanent pour Home Assistant"
version: "1.1.0"
url: "https://github.com/azman0101/ha-ecoflow/tree/main/ecoflow-battery-reader"
image: "ghcr.io/azman0101/ecoflow-delta3-reader"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:want
options:
  email: ""
  password: ""
  device_sn: ""
  instance_id: "ecoflow-bridge"
  snapshot_interval: 60
  freshness_seconds: 180
  topic_prefix: "ecoflow/delta3classic"
  discovery: true
  discovery_prefix: "homeassistant"
  target_margin: 0.2
  local_mqtt:
    host: ""
    port: 1883
    username: ""
    password: ""
    tls: false
schema:
  email: str
  password: password
  device_sn: str
  instance_id: str?
  snapshot_interval: int?
  freshness_seconds: int?
  topic_prefix: str?
  discovery: bool?
  discovery_prefix: str?
  target_margin: float?
  local_mqtt:
    host: str?
    port: int?
    username: str?
    password: password?
    tls: bool?
